<!doctype html>
<html lang="pt"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#000000"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<title>Estatísticas FC Gaia</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#e2b812;--gold-lo:#9c7e08;--bg:#111;--panel:#1d1d1d;--panel2:#262626;--line:#383838;--ink:#f2f2ee;--muted:#a8a8a0;--dim:#6f6f68;--ok:#5fd27a;--ko:#ff7a6e;
 --f-disp:"Anton",Impact,"Arial Narrow",sans-serif;--f-cond:"Barlow Condensed","Arial Narrow",Arial,sans-serif;--f-body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.top{display:flex;align-items:center;gap:12px;padding:10px 14px;background:#000;border-bottom:3px solid var(--gold)}
.top img{width:34px;height:auto}
.top h1{margin:0;font-family:var(--f-disp);font-weight:400;font-size:20px;text-transform:uppercase;letter-spacing:.5px;line-height:1}
.top h1 small{display:block;font-family:var(--f-cond);font-size:13px;color:var(--gold);letter-spacing:2px}
.top .sp{flex:1}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 14px;font-weight:700;font-family:var(--f-cond);text-transform:uppercase;letter-spacing:.8px;font-size:15px}
.btn:hover{border-color:var(--gold)}
.btn.gold{background:var(--gold);color:#000;border-color:var(--gold)}
.btn.ghost{background:transparent}
.btn.danger{border-color:#7a2a24;color:var(--ko)}
.btn:disabled{opacity:.4;cursor:not-allowed}
main{max-width:1200px;margin:0 auto;padding:14px}
h2{font-family:var(--f-disp);font-weight:400;text-transform:uppercase;color:var(--gold);font-size:28px;margin:6px 0 12px}
h3{font-family:var(--f-cond);text-transform:uppercase;letter-spacing:1.5px;font-size:14px;color:var(--muted);margin:16px 0 8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:700;min-width:0}
label.f select,label.f input{background:#0b0b0b;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:16px;min-width:0;text-transform:none;letter-spacing:0;font-weight:500;color:var(--ink)}
.grow{flex:1 1 240px}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.ritem{display:grid;grid-template-columns:28px 58px 1fr 44px;align-items:center;gap:8px;background:#0b0b0b;border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.ritem.on{border-color:var(--gold-lo)}
.ritem input[type=checkbox]{width:20px;height:20px;accent-color:var(--gold)}
.ritem input.num{width:58px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px;text-align:center;font-weight:700}
.ritem .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ritem .st{border:1px solid var(--line);border-radius:6px;background:transparent;font-size:11px;font-weight:800;padding:6px 0;color:var(--dim)}
.ritem .st.on{background:var(--gold);color:#000;border-color:var(--gold)}
.hint{color:var(--dim);font-size:13px;margin:6px 0 0}
.err{color:var(--ko);font-weight:700;margin:8px 0 0;min-height:1em}
/* ---- jogo ---- */
.board{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;background:#000;border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.tm{display:flex;flex-direction:column;min-width:0}
.tm.r{align-items:flex-end;text-align:right}
.tm .n{font-family:var(--f-cond);font-weight:700;text-transform:uppercase;letter-spacing:1px;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.tm .s{font-family:var(--f-disp);font-size:54px;line-height:1;color:var(--gold)}
.tm.r .s{color:var(--ink)}
.tm .tf{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:700}
.tm .tf b{color:var(--ink)}.tm .tf b.bonus{color:var(--ko)}
.clock{display:flex;flex-direction:column;align-items:center;gap:4px}
.clock .t{font-family:var(--f-disp);font-size:44px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:1px}
.clock .t.run{color:var(--ok)}
.clock .p{font-family:var(--f-cond);font-weight:700;letter-spacing:2px;color:var(--muted);text-transform:uppercase;font-size:13px}
.clock .cb{display:flex;gap:6px}
.clock .cb .btn{padding:7px 10px;font-size:13px}
.opp{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;margin-top:6px}
.opp .btn{padding:6px 10px;font-size:13px}
.live{display:grid;grid-template-columns:250px minmax(0,1fr) 300px;gap:14px;margin-top:10px;align-items:start}
.plist{display:grid;gap:6px}
.pl{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:8px;background:var(--panel);border:2px solid transparent;border-radius:10px;padding:8px 10px;text-align:left;width:100%;min-height:58px}
.pl .nb{font-family:var(--f-disp);font-size:26px;color:var(--gold);text-align:center}
.pl .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pl .sm{display:block;font-size:12px;color:var(--muted);font-weight:600}
.pl .fo{font-family:var(--f-cond);font-weight:700;font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.pl .fo b{display:block;font-family:var(--f-disp);font-weight:400;font-size:22px;color:var(--ink)}
.pl .fo i{font-style:normal;color:var(--ko)}
.pl .fo.f4 b{color:var(--gold)}.pl .fo.f5 b{color:var(--ko)}
.pl.sel{border-color:var(--gold);background:#2a2610}
.pl.bench{background:#141414;min-height:48px;padding:6px 10px}
.pl.bench .nb{color:var(--dim);font-size:20px}
.pl.subpick{border-color:#5aa0ff}
.pl.out5{opacity:.45}
.benchw{margin-top:8px}
.ccol{min-width:0}
.cwrap{position:relative}
svg.court{display:block;width:100%;height:auto;max-height:calc(100vh - 290px);border-radius:10px;touch-action:manipulation}
svg.court.live{cursor:crosshair}
.c-floor{fill:#1e1a12}.c-paint{fill:rgba(226,184,18,.09);stroke:#8a7a4a;stroke-width:5}
.c-line,.c-3p{fill:none;stroke:#8a7a4a;stroke-width:5}.c-3p{stroke:#c9a64a}
.c-board{stroke:#ddd;stroke-width:8}.c-rim{fill:none;stroke:#ff8a3d;stroke-width:6}
.c-out{fill:none;stroke:#8a7a4a;stroke-width:10}
.mk-ok{fill:var(--ok);stroke:#0b2a12;stroke-width:5;opacity:.9}.mk-ko{stroke:var(--ko);stroke-width:9;stroke-linecap:round;fill:none}
.mk-tmp{fill:none;stroke:#fff;stroke-width:6;stroke-dasharray:10 8}
.cmask{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.45);color:var(--muted);font-weight:700;border-radius:10px;pointer-events:none;text-align:center;padding:20px}
.chint{font-size:12px;color:var(--dim);margin:6px 0 0;text-align:center}
.shotpop{position:absolute;z-index:4;width:270px;background:#000;border:2px solid var(--gold);border-radius:12px;padding:10px;box-shadow:0 10px 30px rgba(0,0,0,.7)}
.shotpop p{margin:0 0 8px;font-size:14px;text-align:center}
.sp-b{display:grid;grid-template-columns:1fr 1fr;gap:8px}.sp-b .act{padding:16px 4px;font-size:18px}
.sp-l{display:flex;justify-content:space-between;gap:6px;margin-top:8px}
.btn.sm{padding:6px 10px;font-size:13px}
.zsep path{stroke:#000;stroke-opacity:.25;stroke-width:4;fill:none}
.zl text{text-anchor:middle;paint-order:stroke;stroke:#000;stroke-width:10px;stroke-linejoin:round}
.zl-n{font-family:var(--f-disp);font-size:64px;fill:#fff}
.zl-v{font-family:var(--f-cond);font-weight:700;font-size:44px;fill:#fff}
.zsw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:8px;vertical-align:-1px}
table.bs tr.avgr td{background:#121a12;font-weight:700;color:#cfe8cf}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:12px 0}
.kpis div{background:#0b0b0b;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpis b{display:block;font-family:var(--f-disp);font-weight:400;font-size:30px;color:var(--gold);line-height:1}
.kpis span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;font-weight:700}
.who{display:flex;align-items:center;gap:10px}.wn{display:flex;flex-direction:column;line-height:1.15;text-align:right}.wn b{font-size:14px}.wn small{font-size:11px;color:var(--muted)}
.net{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:#ffb35c;display:inline-flex;align-items:center;gap:5px}.net::before{content:"";width:8px;height:8px;border-radius:50%;background:#ffb35c}
.net.on{color:var(--ok)}.net.on::before{background:var(--ok)}
.login{display:grid;place-items:center;min-height:calc(100vh - 120px)}
.lcard{width:min(420px,100%);text-align:center;padding:26px}.lcard img{width:84px;height:auto}.lcard h2{margin:8px 0 10px}
.lcard form{display:grid;gap:10px;text-align:left}.pub.on{border-color:var(--gold,#d4a017)}.ghh{margin:6px 0 10px}.ghh summary{cursor:pointer;color:var(--gold);font-weight:700}.ghh ol{margin:8px 0 0;padding-left:20px;line-height:1.5}.demo{margin-top:16px;font-size:13px;color:var(--muted);background:#0b0b0b;border:1px dashed var(--line);border-radius:8px;padding:10px;text-align:left}
.chks{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-top:12px}.chk{display:inline-flex;align-items:center;gap:6px;background:#0b0b0b;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-weight:600}.chk input{width:18px;height:18px;accent-color:var(--gold)}
.tag{display:inline-block;background:#2a2610;border:1px solid var(--gold-lo);color:var(--gold);border-radius:6px;padding:1px 7px;font-size:12px;font-weight:700;margin:1px}
table.bs.ul td{white-space:normal}table.bs.ul tr.off td{opacity:.5}.acts-u{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
@media (max-width:760px){.wn{display:none}}
.snav{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 14px;border-bottom:1px solid var(--line)}
.snav button{background:transparent;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-family:var(--f-cond);font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-size:16px}
.snav button[aria-pressed=true]{color:var(--gold);border-color:var(--gold)}
.seg2.big button{padding:10px 16px;font-size:15px}
.eps{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:12px;color:var(--muted);font-size:14px}.eps b{color:var(--ink);font-size:18px}
.epg{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:6px}
.epgi{display:flex;align-items:center;gap:8px;background:#0b0b0b;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:14px;opacity:.55}
.epgi.on{opacity:1;border-color:var(--gold-lo)}.epgi input{width:18px;height:18px;accent-color:var(--gold)}.epgi span{flex:1;min-width:0}
.epgi b.w{color:var(--ok)}.epgi b.l{color:var(--ko)}
.lnk{background:none;border:0;color:var(--gold);font-weight:700;font-size:12px;text-transform:uppercase;white-space:nowrap}
table.bs.ep th{cursor:pointer}table.bs.ep th.srt{color:var(--gold)}table.bs.ep tbody tr{cursor:pointer}table.bs.ep tbody tr:hover td{background:#1a1709}
table.bs td small{color:var(--muted);font-weight:500}
.athp{margin-top:16px;border-color:var(--gold-lo)}.athh{display:flex;justify-content:space-between;align-items:center}
.saved{display:grid;gap:8px}
.sv{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.sv-i{display:flex;flex-direction:column;gap:2px;min-width:0}.sv-i span{font-size:13px;color:var(--muted)}.sv-i em{color:var(--ok);font-style:normal;font-weight:700}
.sv-b{display:flex;gap:6px}
label.btn{display:inline-flex;align-items:center}
.sidebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.seg2{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg2 button{background:transparent;border:0;padding:8px 14px;font-family:var(--f-cond);font-weight:700;text-transform:uppercase;letter-spacing:.8px;font-size:14px;color:var(--muted);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg2 button[aria-pressed=true]{background:var(--gold);color:#000}
.seg2 button[data-side=them][aria-pressed=true]{background:#5aa0ff;color:#000}
.selname.o{color:#8cbcff}
.cwrap.o svg.court .c-floor,.sc-court.o svg.court .c-floor{fill:#121a26}
.cwrap.o .mk-ok,.sc-court.o .mk-ok{fill:#5aa0ff;stroke:#0a1a33}
.agrp{grid-column:1/-1;margin:6px 0 -2px;font-family:var(--f-cond);font-weight:700;text-transform:uppercase;letter-spacing:1.5px;font-size:11px;color:var(--dim)}
.act.wide{grid-column:1/-1}
.act.fr{border:2px dashed #3d7fd6;background:#101c2e;color:#cfe2ff}
table.bs tr.oppr td{color:#8cbcff;border-top:1px dashed #3d5a80}
.plist.court5 .subm{display:none}
@media (max-width:1100px){.plist.court5 .subm{display:block}}
.secth{display:flex;align-items:center;justify-content:space-between;margin:10px 0 6px}
.secth h3{margin:0}
.acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.act{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:14px 4px;min-height:62px;font-family:var(--f-cond);font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:.5px;line-height:1.05}
.act small{display:block;font-size:12px;color:var(--muted);letter-spacing:1px}
.act.mk{border-color:#2d5a36;background:#15281a}.act.mk small{color:var(--ok)}
.act.ms{border-color:#5a2d2d;background:#2a1616}.act.ms small{color:var(--ko)}
.act.fl{border-color:#6b5a14;background:#2a2410}.act.fx{border-color:#7a2a24;background:#2a1412}.act.fx small{color:var(--ko)}
.act:disabled{opacity:.35}
.act:active{transform:scale(.97)}
.selname{font-family:var(--f-disp);font-size:22px;text-transform:uppercase;color:var(--gold);margin:2px 0 8px;min-height:28px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.tabs{display:flex;gap:6px;margin:16px 0 8px;border-bottom:1px solid var(--line)}
.tabs button{background:transparent;border:0;border-bottom:3px solid transparent;padding:8px 12px;font-family:var(--f-cond);font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-size:15px}
.tabs button[aria-selected=true]{color:var(--gold);border-color:var(--gold)}
.tblw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table.bs{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
table.bs th,table.bs td{padding:7px 8px;text-align:center;white-space:nowrap;border-bottom:1px solid #2a2a2a}
table.bs th{font-family:var(--f-cond);font-size:12px;letter-spacing:1px;color:var(--muted);text-transform:uppercase;background:#0b0b0b;position:sticky;top:0}
table.bs td.l,table.bs th.l{text-align:left}
table.bs tr.tot td{font-weight:800;border-top:2px solid var(--gold);background:#17150a}
table.bs tr.oncourt td:first-child{box-shadow:inset 3px 0 0 var(--ok)}
.pbp{list-style:none;margin:0;padding:0;max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.pbp li{display:grid;grid-template-columns:62px 58px 1fr 64px;gap:8px;padding:7px 10px;border-bottom:1px solid #262626;font-size:14px;align-items:center}
.pbp li .q{color:var(--muted);font-family:var(--f-cond);font-weight:700}
.pbp.mini{max-height:190px;margin-top:10px}.pbp.mini li{grid-template-columns:30px 44px 1fr 46px;font-size:12.5px;padding:6px 8px}
.sc-wrap{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;align-items:start}.sc-court{max-width:560px}.sc-court svg.court{max-height:none}.sc-side{display:grid;gap:10px}
.pbp li .sc{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.pbp li.opp{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#000;border:1px solid var(--gold);color:var(--ink);padding:10px 16px;border-radius:999px;font-weight:700;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.6)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:grid;place-items:center;z-index:30;padding:16px}
.modal .card{max-width:420px;width:100%}
.lock{display:grid;place-items:center;min-height:70vh}
@media (max-width:1100px){
 /* ecrãs médios (tablet ao alto, janela estreita): atletas em fila em cima, campo e ações lado a lado, banco por baixo */
 .live{display:grid;grid-template-columns:minmax(0,1fr) 230px;grid-template-areas:"s s" "c a" "b b";gap:10px}
 .lcol{display:contents}.lcol .secth{display:none}.plist.court5{grid-area:s;grid-template-columns:repeat(5,minmax(0,1fr)) auto}
 .ccol{grid-area:c}.acol{grid-area:a}.benchw{grid-area:b;margin-top:0}
 .plist.court5 .pl{grid-template-columns:26px minmax(0,1fr) auto;min-height:0;padding:6px 8px;gap:6px}.plist.court5 .pl .nb{font-size:22px}.plist.court5 .pl .fo{font-size:0}.plist.court5 .pl .fo b{font-size:20px}.plist.court5 .pl .fo i{font-size:11px;display:block}
 .plist.court5 .subm{align-self:stretch;writing-mode:vertical-rl;transform:rotate(180deg);padding:6px 4px}
 .plist.bench{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
 .acts{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.act{min-height:52px;padding:8px 2px;font-size:16px}.act small{font-size:10px;letter-spacing:.3px}
 svg.court{max-height:max(300px,calc(100vh - 400px))}.cwrap{max-width:calc(max(300px,calc(100vh - 400px))*1.0714);margin:0 auto}
 .pbp.mini li{grid-template-columns:28px 1fr 40px}.pbp.mini li span:nth-child(2){display:none}}
@media (max-width:600px){.live{display:flex;flex-direction:column}.plist.court5{order:2;grid-template-columns:repeat(5,minmax(0,1fr))}.plist.court5 .subm{grid-column:1/-1;writing-mode:horizontal-tb;transform:none}.ccol{order:3}.acol{order:4}.benchw{order:5}.acts{grid-template-columns:repeat(4,minmax(0,1fr))}
 .plist.court5 .pl{grid-template-columns:1fr;text-align:center;padding:6px 2px;gap:0;min-height:0}.plist.court5 .pl .nm{font-size:11px}.plist.court5 .pl .sm{display:none}.plist.court5 .pl .fo{text-align:center;font-size:10px}.plist.court5 .pl .fo b{display:inline;font-size:14px;margin-right:2px}
 .plist.bench{grid-template-columns:repeat(2,minmax(0,1fr))}.tm .s{font-size:42px}.clock .t{font-size:36px}.sc-wrap{grid-template-columns:1fr}svg.court{max-height:none}}
@media (max-width:520px){.board{grid-template-columns:1fr 1fr;grid-template-areas:"a b" "c c"}.board .tm:first-child{grid-area:a}.board .tm.r{grid-area:b}.board .clock{grid-area:c;flex-direction:row;justify-content:center;flex-wrap:wrap}
 .act{font-size:15px;padding:12px 2px}.act small{font-size:9.5px;letter-spacing:0}.top h1 small{letter-spacing:1px}.top .btn{padding:7px 10px;font-size:13px}.pbp li{grid-template-columns:52px 46px 1fr 56px;font-size:13px}.shotpop{width:240px}}

.pcpos{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.8px}

/* atletas no jogo */

/* ===== v7: ecrã de utilizadores ===== */

.uf-esc{border:0;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:8px;align-content:start}

.urow.cur{border-color:var(--gold)}.urow.off{opacity:.55}
.uav{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line);font-family:var(--f-cond);font-weight:800;font-size:16px;color:var(--muted)}

.gc.big{grid-template-columns:170px minmax(0,1fr) 40px}.gd b{white-space:nowrap}.gc{grid-template-columns:130px minmax(0,1fr) 34px}

.uf-role{border:0;margin:0 0 4px;padding:0;display:grid;gap:6px}.uf-role legend{padding:0;margin-bottom:6px;font-family:var(--f-cond);font-weight:700;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}

.hhelp{display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:6px 18px 6px 6px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-weight:800;font-size:16px;cursor:pointer}
.hhelp:hover,.hhelp:focus-visible{border-color:var(--gold)}.hhelp .hic{width:40px;height:40px;border-radius:50%}.hhelp .hic svg{width:26px;height:26px}
@media (max-width:560px){.hhello{grid-template-columns:1fr auto}.hhello p{grid-column:1/-1;justify-self:start;text-align:left;font-size:20px}}
:root[data-theme=light] .hhelp{background:#fff}
.hgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:4px}
@media (max-width:560px){.hgrid{grid-template-columns:1fr}}
.htile{display:grid;grid-template-columns:64px minmax(0,1fr) 20px;align-items:center;gap:16px;min-height:112px;padding:16px 20px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:16px;color:var(--ink);font:inherit;cursor:pointer;transition:border-color .15s,transform .1s}
.htile:hover,.htile:focus-visible{border-color:var(--gold)}.htile:active{transform:scale(.985)}
.htile.main{grid-column:1/-1;min-height:128px;background:var(--gold);border-color:var(--gold);color:#111}
.htile.main small,.htile.main .har{color:#3a3000}.htile.main .hic{background:rgba(0,0,0,.12);color:#111}
.hic{width:64px;height:64px;border-radius:14px;background:var(--panel2);display:grid;place-items:center;color:var(--gold)}
.hic svg{width:38px;height:38px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.htx{min-width:0}.htx b{display:block;font-family:var(--f-disp);font-weight:400;font-size:28px;line-height:1.1;text-transform:uppercase;letter-spacing:.5px}.htx small{display:block;color:var(--muted);font-size:14px;margin-top:3px;font-weight:600}
.har{font-size:30px;color:var(--muted);line-height:1}
.hopen,.hng{display:grid;align-items:center;gap:14px;width:100%;text-align:left;font:inherit;color:var(--ink);cursor:pointer;border-radius:14px}
.hopen{grid-template-columns:14px minmax(0,1fr) auto auto;padding:16px 20px;margin-bottom:10px;background:rgba(226,184,18,.1);border:2px solid var(--gold)}
.hopen .htx small{color:var(--gold);text-transform:uppercase;letter-spacing:1px;font-weight:800;font-size:12px}.hopen .htx b{font-size:24px}
.hdot{width:12px;height:12px;border-radius:50%;background:var(--ko);box-shadow:0 0 0 4px rgba(220,60,50,.2);animation:hpulse 1.6s infinite}
@keyframes hpulse{50%{box-shadow:0 0 0 8px rgba(220,60,50,0)}}
@media (prefers-reduced-motion:reduce){.hdot{animation:none}}
.hsc{font-family:var(--f-disp);font-size:32px}.hgo{font-weight:800;color:var(--gold);white-space:nowrap}
.hnext h3{margin:22px 0 4px}.hnext{display:grid;gap:8px}
.hng{grid-template-columns:96px minmax(0,1fr) auto;padding:12px 18px;background:var(--panel);border:1px solid var(--line)}.hng:hover{border-color:var(--gold)}
.hng .hd b{display:block;font-weight:800}.hng .hd small{color:var(--muted)}.hng .htx b{font-size:20px}
:root[data-theme=light] .htile,:root[data-theme=light] .hng{background:#fff}:root[data-theme=light] .htile.main{background:var(--gold);color:#111}
:root[data-theme=light] .hic{background:#f3f0e0;color:var(--gold-ink)}:root[data-theme=light] .hgo,:root[data-theme=light] .hopen .htx small{color:var(--gold-ink)}:root[data-theme=light] .hopen{background:#fff6cf}

/* ===== v20: avisos de envio ===== */
.hb-ico{display:grid;place-items:center;font-size:44px;color:var(--gold);background:var(--panel2);border-radius:10px;min-height:90px}
#toast.tk-ok{border-color:var(--ok)}#toast.tk-warn,#toast.tk-ok{max-width:min(560px,92vw);width:max-content;border-radius:14px;text-align:center;line-height:1.35}#toast.tk-warn{border-color:var(--gold)}#toast.tk-ok{color:#fff}#toast.tk-busy{border-color:var(--line)}
#toast.tk-busy::before{content:"";display:inline-block;width:12px;height:12px;margin-right:10px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;vertical-align:-1px;animation:tkspin .8s linear infinite}
@keyframes tkspin{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){#toast.tk-busy::before{animation:none}}
.sync[hidden]{display:none!important}

/* ===== v21: seletor de equipa em destaque ===== */
.tsw{flex:1;min-width:0;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:8px}
.tsw-b{position:relative;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:1px;min-height:54px;min-width:0;padding:6px 12px 6px 16px;border-radius:12px;border:2px solid var(--line);background:var(--panel);color:var(--muted);font:inherit;text-align:left;cursor:pointer;overflow:hidden}
.tsw-b::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--gold)}.tsw-b.them::before{background:#5aa0ff}
.tsw-b b{font-family:var(--f-disp);font-weight:400;font-size:20px;line-height:1.05;text-transform:uppercase;letter-spacing:.5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tsw-b small{font-size:13px;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.85}.tsw-b small em{font-style:normal;font-family:var(--f-disp);font-size:17px}
.tsw-b.us[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:#111}.tsw-b.us[aria-pressed=true]::before{background:#111;opacity:.25}
.tsw-b.them[aria-pressed=true]{background:#5aa0ff;border-color:#5aa0ff;color:#04121f}.tsw-b.them[aria-pressed=true]::before{background:#04121f;opacity:.25}
.tsw-b.them[aria-pressed=false]{border-color:rgba(90,160,255,.55);color:#9cc6ff}
.tsw-b:active{transform:scale(.98)}
body.fit .tsw-b{min-height:48px}body.fit .tsw-b b{font-size:18px}
:root[data-theme=light] .tsw-b{background:#fff}:root[data-theme=light] .tsw-b.them[aria-pressed=false]{color:#2f6fd6;border-color:#9dbcf0}
:root[data-theme=light] .tsw-b.them[aria-pressed=true]{background:#2f6fd6;border-color:#2f6fd6;color:#fff}:root[data-theme=light] .tsw-b.us[aria-pressed=true]{color:#111}

/* ===== v22: cartão de dados de acesso ===== */
.crd{max-width:440px!important}.crd-c{background:#0e0e0e;border:1px solid var(--gold);border-radius:14px;padding:18px 20px;color:#fff}
.crd-h{display:flex;align-items:center;gap:12px;padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid #333}.crd-h img{width:44px;height:44px;object-fit:contain}
.crd-h b{display:block;font-family:var(--f-disp);font-weight:400;font-size:24px;color:var(--gold);text-transform:uppercase;letter-spacing:.5px;line-height:1}.crd-h small{color:#aaa;font-weight:600}
.crd dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 16px;margin:0;align-items:baseline}.crd dt{color:#999;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:1px}.crd dd{margin:0;font-weight:700;font-size:16px;overflow-wrap:anywhere}
.crd .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.crd .pw{font-size:24px;color:var(--gold);letter-spacing:1px}.crd .sm{font-size:13px;color:#ccc}

.ualert{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border:2px solid var(--gold);background:rgba(226,184,18,.1);border-radius:12px;padding:12px 16px;margin:0 0 16px;font-weight:600}
:root[data-theme=light] .ualert{background:#fff6cf}

.ucargo{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}.ucargo span{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:1px}

/* ===== v23: pessoas do clube ===== */
.ppl{margin-bottom:16px}.ppl-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.ppl-g h4{margin:12px 0 6px;font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.ppl-l{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px}
.pp{display:flex;align-items:center;gap:10px;text-align:left;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font:inherit;cursor:pointer;min-width:0}
.pp>span:last-child{min-width:0}.pp b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pp small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pp .ck{flex:none;width:22px;height:22px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;font-weight:900;font-size:13px}
.pp.on{border-color:var(--gold);background:rgba(226,184,18,.12)}.pp.on .ck{background:var(--gold);border-color:var(--gold);color:#111}
.pp.done{opacity:.55;cursor:default}.pp.done .ck{border-color:var(--ok);color:var(--ok)}
.crdl{max-width:520px!important;max-height:88vh;display:flex;flex-direction:column}.crdl-l{overflow:auto;display:grid;gap:12px;padding-right:4px}
:root[data-theme=light] .pp{background:#fff}:root[data-theme=light] .pp.on{background:#fff6cf}

.ulh{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.ulh h3{margin:0}
.uav.usel{border:2px dashed var(--line);cursor:pointer;font:inherit;font-weight:800}.uav.usel.on{background:var(--ko);border:2px solid var(--ko);color:#fff;font-size:20px}

/* ===== v24: partilhar vários jogos ===== */
.jhh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:28px;border-top:1px solid var(--line);padding-top:16px}.jhh .jhd{margin:0;border:0;padding:0}
.jsbar{position:sticky;bottom:10px;z-index:5;box-shadow:0 8px 24px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:10px 0;padding:10px 14px;border:2px solid var(--gold);border-radius:12px;background:var(--bg)}
.saved.selm .sv{cursor:pointer;display:flex;align-items:center;justify-content:flex-start;gap:12px}.saved.selm .sv-i{flex:1;text-align:left}.saved.selm .sv .ck{flex:none;width:26px;height:26px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;font-weight:900}
.saved.selm .sv.on{border-color:var(--gold);background:rgba(226,184,18,.1)}.saved.selm .sv.on .ck{background:var(--gold);border-color:var(--gold);color:#111}
:root[data-theme=light] .saved.selm .sv.on{background:#fff6cf}

/* ===== v25: acompanhar ao vivo ===== */
.watchb{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:8px 0;padding:10px 14px;border-radius:12px;border:2px solid #5aa0ff;background:rgba(90,160,255,.1)}
.watchb .wtx{flex:1;min-width:220px}.watchb small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.wdot{width:12px;height:12px;border-radius:50%;background:var(--muted);flex:none}.wdot.on{background:var(--ko);box-shadow:0 0 0 4px rgba(220,60,50,.2);animation:hpulse 1.6s infinite}
:root[data-theme=light] .watchb{background:#eaf2ff;border-color:#2f6fd6}

/* ===== v26: ordenar a ficha dos atletas ===== */
table.bs th.srt-h{cursor:pointer;user-select:none;-webkit-user-select:none;white-space:nowrap}table.bs th.srt-h:hover{color:var(--ink)}
table.bs th.srt{color:var(--gold);background:rgba(226,184,18,.12)}table.bs th i{font-style:normal;font-size:9px;margin-left:3px}
:root[data-theme=light] table.bs th.srt{color:var(--gold-ink);background:#fff6cf}

/* ===== v27: ficha do atleta no jogo ===== */
table.bs tr.prw{cursor:pointer}table.bs tr.prw:hover td{background:rgba(226,184,18,.08)}
.pcard{max-width:860px!important;width:96vw;max-height:92vh;overflow:auto}
.pc-h{display:flex;align-items:center;gap:8px;margin-bottom:12px}.pc-t{flex:1;display:flex;align-items:center;gap:12px;min-width:0}
.pc-n{font-family:var(--f-disp);font-size:44px;line-height:1;color:var(--gold);min-width:56px;text-align:center}.pc-t b{display:block;font-size:22px}.pc-t small{color:var(--muted);font-weight:600}
.pc-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-bottom:14px}
.pc-tiles div{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}.pc-tiles b{display:block;font-family:var(--f-disp);font-weight:400;font-size:26px;line-height:1.1}
.pc-tiles span{display:block;color:var(--muted);font-size:12px;font-weight:700}.pc-tiles small{display:block;color:var(--dim);font-size:11px}
.pc-tiles div:first-child{border-color:var(--gold)}.pc-tiles div:first-child b{color:var(--gold)}
.pc-b{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}.pc-b h4{margin:0 0 6px;font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.pc-map svg.court{max-height:340px;width:100%}.pcl{max-height:340px;overflow:auto;margin:0;padding:0;list-style:none;border:1px solid var(--line);border-radius:10px}.pcl li{display:flex;gap:10px;align-items:baseline;padding:7px 10px;border-bottom:1px solid var(--line);font-size:14px}.pcl li:last-child{border-bottom:0}.pcl .q{flex:none;min-width:70px;color:var(--muted);font-weight:700;font-size:12px}
@media (max-width:640px){.pc-b{grid-template-columns:1fr}}
:root[data-theme=light] .pc-tiles div{background:#fff}:root[data-theme=light] .pc-n,:root[data-theme=light] .pc-tiles div:first-child b{color:var(--gold-ink)}

/* ===== v28: jogo de treino ===== */
.demob{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:repeating-linear-gradient(135deg,#e2b812 0 14px,#d4aa0a 14px 28px);color:#111;border-radius:10px;padding:6px 12px;margin:0 0 8px;font-size:13px}
.demob b{letter-spacing:1.5px}.demob span{flex:1;font-weight:600}.demob .btn{background:#111;color:#fff;border-color:#111}
.htile.demo{border-style:dashed}
body.fit .demob{padding:3px 10px;margin:0 0 4px;font-size:12px}

.epteams{margin:0 0 10px}.tchip small{display:inline-block;margin-left:6px;font-size:11px;font-weight:800;opacity:.7}.tchip.none{opacity:.55}

  const add=(name,kind,meta,teams)=>{if(!name)return;const k=nrm(name);const x=P[k]=P[k]||{name,kinds:[],metas:[],teams:new Set()};x.kinds.push(kind);if(meta)x.metas.push(meta);(teams||[]).forEach(t=>esc.has(t)&&x.teams.add(t))};
  Object.entries(D.staff||{}).forEach(([t,ns])=>ns.forEach(n=>add(n,"treinador",TN[t]||t,[t])));
  Object.entries(D.tm||{}).forEach(([t,ns])=>ns.forEach(n=>add(n,"tm",(TN[t]||t),[t])));
  (D.coord||[]).forEach(c=>add(c.name,"coord",c.role));(D.dirs||[]).forEach(c=>add(c.name,"dir",c.role));
  return Object.values(P).map(x=>{const k=x.kinds;
    const role=k.includes("dir")?{perfil:"consulta",cargo:"Diretor",escaloes:["*"]}:k.includes("coord")?{perfil:"consulta",cargo:"Coordenador",escaloes:["*"]}
      :k.includes("treinador")?{perfil:"consulta",cargo:"Treinador",escaloes:[...x.teams]}:{perfil:"treinador",escaloes:[...x.teams]};
    const grp=k.includes("dir")?"Direção":k.includes("coord")?"Coordenação":k.includes("treinador")?"Treinadores":"Team managers";
    return {...x,grp,role,meta:[...new Set(x.metas)].join(" · ")}}).filter(x=>x.role.escaloes.length)
   .sort((a,b)=>a.name.localeCompare(b.name))}

function genPw(){const r=crypto.getRandomValues(new Uint32Array(4)),w=i=>PWW[r[i]%PWW.length];return w(0)+"-"+w(1)+"-"+w(2)+"-"+String(10+r[3]%90)}

function credBox(un,pw,isNew){const u=USERS.find(x=>x.utilizador===un)||{utilizador:un};const url=(location.host+location.pathname).replace(/index\.html$/,"").replace(/\/$/,"");

async function dbConnect(t,pw){const r=await fetch(`https://api.github.com/repos/${GD.owner}/${GD.repo}`,{headers:{Authorization:"Bearer "+t,Accept:"application/vnd.github+json"},cache:"no-store"});
  if(r.status===404)throw new Error(`Não encontrei o repositório ${GD.repo} (ou o token não tem acesso a ele).`);if(!r.ok)throw new Error("O token não é válido.");
  const j=await r.json();if(j.permissions&&!j.permissions.push)throw new Error("O token não tem permissão de escrita (Contents: Read and write).");
  if(!j.private&&!confirm("Atenção: o repositório é público e os jogos ficariam visíveis para todos. Continuar mesmo assim?"))throw new Error("Torna o repositório privado em Settings e tenta outra vez.");
  const me=USERS.find(u=>u.utilizador===USER.utilizador);let K=null;
  if(me.dk&&UFILE.tk){try{K=await unwrapTok(me.dk,pw,me.salt);await decK(UFILE.tk,K)}catch(e){K=null}}   // chave do clube já existente: os outros mantêm o acesso
  const keep=!!K;if(!K)K=b64(crypto.getRandomValues(new Uint8Array(32)));
  const tk=await encK(t,K),mine=await wrapTok(K,pw,me.salt);
  Acc.save(USERS.map(u=>{if(u.utilizador===USER.utilizador)return {...u,dk:mine};if(keep)return u;const {dk,...r}=u;return r}),{tk});
  lsSet(KK,K);lsSet(DTK,t);return keep}

 ["Convoca no Plantel","No separador Plantel marca quem vai a jogo e carrega em “Convocar → escolher jogo”. O ✎ corrige nome e número; “+ Adicionar jogador” junta quem não está no plantel. A convocatória fica guardada para o jogo seguinte.","1"],
 ["Escolhe o jogo","Em Novo jogo, o jogo de hoje (ou o próximo) já vem escolhido e os convocados também. Se for outro, abre “Escolher jogo de outra data…” ou “Outro jogo”. Carrega em Começar jogo.","2"],

 ["Adversário","Usa +1, +2, +3 e Falta no marcador, ou toca no botão azul do adversário, por cima do campo, para marcar lançamentos e ações dele (o campo fica azul). Para voltar, toca em FC Gaia ou num atleta.","5"],

  m.innerHTML=`<div class="card ce"><h3 style="margin-top:0">Corrigir o tempo · ${esc(qLabel(G.q))}</h3>
   <input id="ce-t" class="ce-t" inputmode="numeric" aria-label="Tempo que falta (mm:ss)">
   <div class="ce-g">${[[-60,"−1 min"],[-10,"−10 s"],[-1,"−1 s"],[1,"+1 s"],[10,"+10 s"],[60,"+1 min"]].map(([d,l])=>`<button class="btn" data-d="${d}">${l}</button>`).join("")}</div>

  document.body.appendChild(m);paint();
