<!doctype html>
<html lang="pt"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#000000"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<title>Estatísticas FC Gaia</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#e2b812;--gold-lo:#9c7e08;--bg:#111;--panel:#1d1d1d;--panel2:#262626;--line:#383838;--ink:#f2f2ee;--muted:#a8a8a0;--dim:#6f6f68;--ok:#5fd27a;--ko:#ff7a6e;
 --f-disp:"Anton",Impact,"Arial Narrow",sans-serif;--f-cond:"Barlow Condensed","Arial Narrow",Arial,sans-serif;--f-body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.top{display:flex;align-items:center;gap:12px;padding:10px 14px;background:#000;border-bottom:3px solid var(--gold)}
.top img{width:34px;height:auto}
.top h1{margin:0;font-family:var(--f-disp);font-weight:400;font-size:20px;text-transform:uppercase;letter-spacing:.5px;line-height:1}
.top h1 small{display:block;font-family:var(--f-cond);font-size:13px;color:var(--gold);letter-spacing:2px}
.top .sp{flex:1}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 14px;font-weight:700;font-family:var(--f-cond);text-transform:uppercase;letter-spacing:.8px;font-size:15px}
.btn:hover{border-color:var(--gold)}
.btn.gold{background:var(--gold);color:#000;border-color:var(--gold)}
.btn.ghost{background:transparent}
.btn.danger{border-color:#7a2a24;color:var(--ko)}
.btn:disabled{opacity:.4;cursor:not-allowed}
main{max-width:1200px;margin:0 auto;padding:14px}
h2{font-family:var(--f-disp);font-weight:400;text-transform:uppercase;color:var(--gold);font-size:28px;margin:6px 0 12px}
h3{font-family:var(--f-cond);text-transform:uppercase;letter-spacing:1.5px;font-size:14px;color:var(--muted);margin:16px 0 8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:700;min-width:0}
label.f select,label.f input{background:#0b0b0b;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:16px;min-width:0;text-transform:none;letter-spacing:0;font-weight:500;color:var(--ink)}
.grow{flex:1 1 240px}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.ritem{display:grid;grid-template-columns:28px 58px 1fr 44px;align-items:center;gap:8px;background:#0b0b0b;border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.ritem.on{border-color:var(--gold-lo)}
.ritem input[type=checkbox]{width:20px;height:20px;accent-color:var(--gold)}
.ritem input.num{width:58px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px;text-align:center;font-weight:700}
.ritem .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ritem .st{border:1px solid var(--line);border-radius:6px;background:transparent;font-size:11px;font-weight:800;padding:6px 0;color:var(--dim)}
.ritem .st.on{background:var(--gold);color:#000;border-color:var(--gold)}
.hint{color:var(--dim);font-size:13px;margin:6px 0 0}
.err{color:var(--ko);font-weight:700;margin:8px 0 0;min-height:1em}
/* ---- jogo ---- */
.board{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;background:#000;border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.tm{display:flex;flex-direction:column;min-width:0}
.tm.r{align-items:flex-end;text-align:right}
.tm .n{font-family:var(--f-cond);font-weight:700;text-transform:uppercase;letter-spacing:1px;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.tm .s{font-family:var(--f-disp);font-size:54px;line-height:1;color:var(--gold)}
.tm.r .s{color:var(--ink)}
.tm .tf{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:700}
.tm .tf b{color:var(--ink)}.tm .tf b.bonus{color:var(--ko)}
.clock{display:flex;flex-direction:column;align-items:center;gap:4px}
.clock .t{font-family:var(--f-disp);font-size:44px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:1px}
.clock .t.run{color:var(--ok)}
.clock .p{font-family:var(--f-cond);font-weight:700;letter-spacing:2px;color:var(--muted);text-transform:uppercase;font-size:13px}
.clock .cb{display:flex;gap:6px}
.clock .cb .btn{padding:7px 10px;font-size:13px}
.opp{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;margin-top:6px}
.opp .btn{padding:6px 10px;font-size:13px}
.live{display:grid;grid-template-columns:250px minmax(0,1fr) 300px;gap:14px;margin-top:10px;align-items:start}
.plist{display:grid;gap:6px}
.pl{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:8px;background:var(--panel);border:2px solid transparent;border-radius:10px;padding:8px 10px;text-align:left;width:100%;min-height:58px}
.pl .nb{font-family:var(--f-disp);font-size:26px;color:var(--gold);text-align:center}
.pl .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pl .sm{display:block;font-size:12px;color:var(--muted);font-weight:600}
.pl .fo{font-family:var(--f-cond);font-weight:700;font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.pl .fo b{display:block;font-family:var(--f-disp);font-weight:400;font-size:22px;color:var(--ink)}
.pl .fo i{font-style:normal;color:var(--ko)}
.pl .fo.f4 b{color:var(--gold)}.pl .fo.f5 b{color:var(--ko)}
.pl.sel{border-color:var(--gold);background:#2a2610}
.pl.bench{background:#141414;min-height:48px;padding:6px 10px}
.pl.bench .nb{color:var(--dim);font-size:20px}
.pl.subpick{border-color:#5aa0ff}
.pl.out5{opacity:.45}
.benchw{margin-top:8px}
.ccol{min-width:0}
.cwrap{position:relative}
svg.court{display:block;width:100%;height:auto;max-height:calc(100vh - 290px);border-radius:10px;touch-action:manipulation}
svg.court.live{cursor:crosshair}
.c-floor{fill:#1e1a12}.c-paint{fill:rgba(226,184,18,.09);stroke:#8a7a4a;stroke-width:5}
.c-line,.c-3p{fill:none;stroke:#8a7a4a;stroke-width:5}.c-3p{stroke:#c9a64a}
.c-board{stroke:#ddd;stroke-width:8}.c-rim{fill:none;stroke:#ff8a3d;stroke-width:6}
.c-out{fill:none;stroke:#8a7a4a;stroke-width:10}
.mk-ok{fill:var(--ok);stroke:#0b2a12;stroke-width:5;opacity:.9}.mk-ko{stroke:var(--ko);stroke-width:9;stroke-linecap:round;fill:none}
.mk-tmp{fill:none;stroke:#fff;stroke-width:6;stroke-dasharray:10 8}
.cmask{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.45);color:var(--muted);font-weight:700;border-radius:10px;pointer-events:none;text-align:center;padding:20px}
.chint{font-size:12px;color:var(--dim);margin:6px 0 0;text-align:center}
.shotpop{position:absolute;z-index:4;width:270px;background:#000;border:2px solid var(--gold);border-radius:12px;padding:10px;box-shadow:0 10px 30px rgba(0,0,0,.7)}
.shotpop p{margin:0 0 8px;font-size:14px;text-align:center}
.sp-b{display:grid;grid-template-columns:1fr 1fr;gap:8px}.sp-b .act{padding:16px 4px;font-size:18px}
.sp-l{display:flex;justify-content:space-between;gap:6px;margin-top:8px}
.btn.sm{padding:6px 10px;font-size:13px}
.zsep path{stroke:#000;stroke-opacity:.25;stroke-width:4;fill:none}
.zl text{text-anchor:middle;paint-order:stroke;stroke:#000;stroke-width:10px;stroke-linejoin:round}
.zl-n{font-family:var(--f-disp);font-size:64px;fill:#fff}
.zl-v{font-family:var(--f-cond);font-weight:700;font-size:44px;fill:#fff}
.zsw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:8px;vertical-align:-1px}
table.bs tr.avgr td{background:#121a12;font-weight:700;color:#cfe8cf}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:12px 0}
.kpis div{background:#0b0b0b;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpis b{display:block;font-family:var(--f-disp);font-weight:400;font-size:30px;color:var(--gold);line-height:1}
.kpis span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;font-weight:700}
.who{display:flex;align-items:center;gap:10px}.wn{display:flex;flex-direction:column;line-height:1.15;text-align:right}.wn b{font-size:14px}.wn small{font-size:11px;color:var(--muted)}
.net{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:#ffb35c;display:inline-flex;align-items:center;gap:5px}.net::before{content:"";width:8px;height:8px;border-radius:50%;background:#ffb35c}
.net.on{color:var(--ok)}.net.on::before{background:var(--ok)}
.login{display:grid;place-items:center;min-height:calc(100vh - 120px)}
.lcard{width:min(420px,100%);text-align:center;padding:26px}.lcard img{width:84px;height:auto}.lcard h2{margin:8px 0 10px}
.lcard form{display:grid;gap:10px;text-align:left}.pub.on{border-color:var(--gold,#d4a017)}.ghh{margin:6px 0 10px}.ghh summary{cursor:pointer;color:var(--gold);font-weight:700}.ghh ol{margin:8px 0 0;padding-left:20px;line-height:1.5}.demo{margin-top:16px;font-size:13px;color:var(--muted);background:#0b0b0b;border:1px dashed var(--line);border-radius:8px;padding:10px;text-align:left}
.chks{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-top:12px}.chk{display:inline-flex;align-items:center;gap:6px;background:#0b0b0b;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-weight:600}.chk input{width:18px;height:18px;accent-color:var(--gold)}
.tag{display:inline-block;background:#2a2610;border:1px solid var(--gold-lo);color:var(--gold);border-radius:6px;padding:1px 7px;font-size:12px;font-weight:700;margin:1px}
table.bs.ul td{white-space:normal}table.bs.ul tr.off td{opacity:.5}.acts-u{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
@media (max-width:760px){.wn{display:none}}
.snav{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 14px;border-bottom:1px solid var(--line)}
.snav button{background:transparent;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-family:var(--f-cond);font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-size:16px}
.snav button[aria-pressed=true]{color:var(--gold);border-color:var(--gold)}
.seg2.big button{padding:10px 16px;font-size:15px}
.eps{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:12px;color:var(--muted);font-size:14px}.eps b{color:var(--ink);font-size:18px}
.epg{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:6px}
.epgi{display:flex;align-items:center;gap:8px;background:#0b0b0b;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:14px;opacity:.55}
.epgi.on{opacity:1;border-color:var(--gold-lo)}.epgi input{width:18px;height:18px;accent-color:var(--gold)}.epgi span{flex:1;min-width:0}
.epgi b.w{color:var(--ok)}.epgi b.l{color:var(--ko)}
.lnk{background:none;border:0;color:var(--gold);font-weight:700;font-size:12px;text-transform:uppercase;white-space:nowrap}
table.bs.ep th{cursor:pointer}table.bs.ep th.srt{color:var(--gold)}table.bs.ep tbody tr{cursor:pointer}table.bs.ep tbody tr:hover td{background:#1a1709}
table.bs td small{color:var(--muted);font-weight:500}
.athp{margin-top:16px;border-color:var(--gold-lo)}.athh{display:flex;justify-content:space-between;align-items:center}
.saved{display:grid;gap:8px}
.sv{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.sv-i{display:flex;flex-direction:column;gap:2px;min-width:0}.sv-i span{font-size:13px;color:var(--muted)}.sv-i em{color:var(--ok);font-style:normal;font-weight:700}
.sv-b{display:flex;gap:6px}
label.btn{display:inline-flex;align-items:center}
.sidebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.seg2{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg2 button{background:transparent;border:0;padding:8px 14px;font-family:var(--f-cond);font-weight:700;text-transform:uppercase;letter-spacing:.8px;font-size:14px;color:var(--muted);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg2 button[aria-pressed=true]{background:var(--gold);color:#000}
.seg2 button[data-side=them][aria-pressed=true]{background:#5aa0ff;color:#000}
.selname.o{color:#8cbcff}
.cwrap.o svg.court .c-floor,.sc-court.o svg.court .c-floor{fill:#121a26}
.cwrap.o .mk-ok,.sc-court.o .mk-ok{fill:#5aa0ff;stroke:#0a1a33}
.agrp{grid-column:1/-1;margin:6px 0 -2px;font-family:var(--f-cond);font-weight:700;text-transform:uppercase;letter-spacing:1.5px;font-size:11px;color:var(--dim)}
.act.wide{grid-column:1/-1}
.act.fr{border:2px dashed #3d7fd6;background:#101c2e;color:#cfe2ff}
table.bs tr.oppr td{color:#8cbcff;border-top:1px dashed #3d5a80}
.plist.court5 .subm{display:none}
@media (max-width:1100px){.plist.court5 .subm{display:block}}
.secth{display:flex;align-items:center;justify-content:space-between;margin:10px 0 6px}
.secth h3{margin:0}
.acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.act{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:14px 4px;min-height:62px;font-family:var(--f-cond);font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:.5px;line-height:1.05}
.act small{display:block;font-size:12px;color:var(--muted);letter-spacing:1px}
.act.mk{border-color:#2d5a36;background:#15281a}.act.mk small{color:var(--ok)}
.act.ms{border-color:#5a2d2d;background:#2a1616}.act.ms small{color:var(--ko)}
.act.fl{border-color:#6b5a14;background:#2a2410}.act.fx{border-color:#7a2a24;background:#2a1412}.act.fx small{color:var(--ko)}
.act:disabled{opacity:.35}
.act:active{transform:scale(.97)}
.selname{font-family:var(--f-disp);font-size:22px;text-transform:uppercase;color:var(--gold);margin:2px 0 8px;min-height:28px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.tabs{display:flex;gap:6px;margin:16px 0 8px;border-bottom:1px solid var(--line)}
.tabs button{background:transparent;border:0;border-bottom:3px solid transparent;padding:8px 12px;font-family:var(--f-cond);font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-size:15px}
.tabs button[aria-selected=true]{color:var(--gold);border-color:var(--gold)}
.tblw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table.bs{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
table.bs th,table.bs td{padding:7px 8px;text-align:center;white-space:nowrap;border-bottom:1px solid #2a2a2a}
table.bs th{font-family:var(--f-cond);font-size:12px;letter-spacing:1px;color:var(--muted);text-transform:uppercase;background:#0b0b0b;position:sticky;top:0}
table.bs td.l,table.bs th.l{text-align:left}
table.bs tr.tot td{font-weight:800;border-top:2px solid var(--gold);background:#17150a}
table.bs tr.oncourt td:first-child{box-shadow:inset 3px 0 0 var(--ok)}
.pbp{list-style:none;margin:0;padding:0;max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.pbp li{display:grid;grid-template-columns:62px 58px 1fr 64px;gap:8px;padding:7px 10px;border-bottom:1px solid #262626;font-size:14px;align-items:center}
.pbp li .q{color:var(--muted);font-family:var(--f-cond);font-weight:700}
.pbp.mini{max-height:190px;margin-top:10px}.pbp.mini li{grid-template-columns:30px 44px 1fr 46px;font-size:12.5px;padding:6px 8px}
.sc-wrap{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;align-items:start}.sc-court{max-width:560px}.sc-court svg.court{max-height:none}.sc-side{display:grid;gap:10px}
.pbp li .sc{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.pbp li.opp{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#000;border:1px solid var(--gold);color:var(--ink);padding:10px 16px;border-radius:999px;font-weight:700;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.6)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:grid;place-items:center;z-index:30;padding:16px}
.modal .card{max-width:420px;width:100%}
.lock{display:grid;place-items:center;min-height:70vh}
@media (max-width:1100px){
 /* ecrãs médios (tablet ao alto, janela estreita): atletas em fila em cima, campo e ações lado a lado, banco por baixo */
 .live{display:grid;grid-template-columns:minmax(0,1fr) 230px;grid-template-areas:"s s" "c a" "b b";gap:10px}
 .lcol{display:contents}.lcol .secth{display:none}.plist.court5{grid-area:s;grid-template-columns:repeat(5,minmax(0,1fr)) auto}
 .ccol{grid-area:c}.acol{grid-area:a}.benchw{grid-area:b;margin-top:0}
 .plist.court5 .pl{grid-template-columns:26px minmax(0,1fr) auto;min-height:0;padding:6px 8px;gap:6px}.plist.court5 .pl .nb{font-size:22px}.plist.court5 .pl .fo{font-size:0}.plist.court5 .pl .fo b{font-size:20px}.plist.court5 .pl .fo i{font-size:11px;display:block}
 .plist.court5 .subm{align-self:stretch;writing-mode:vertical-rl;transform:rotate(180deg);padding:6px 4px}
 .plist.bench{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
 .acts{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.act{min-height:52px;padding:8px 2px;font-size:16px}.act small{font-size:10px;letter-spacing:.3px}
 svg.court{max-height:max(300px,calc(100vh - 400px))}.cwrap{max-width:calc(max(300px,calc(100vh - 400px))*1.0714);margin:0 auto}
 .pbp.mini li{grid-template-columns:28px 1fr 40px}.pbp.mini li span:nth-child(2){display:none}}
@media (max-width:600px){.live{display:flex;flex-direction:column}.plist.court5{order:2;grid-template-columns:repeat(5,minmax(0,1fr))}.plist.court5 .subm{grid-column:1/-1;writing-mode:horizontal-tb;transform:none}.ccol{order:3}.acol{order:4}.benchw{order:5}.acts{grid-template-columns:repeat(4,minmax(0,1fr))}
 .plist.court5 .pl{grid-template-columns:1fr;text-align:center;padding:6px 2px;gap:0;min-height:0}.plist.court5 .pl .nm{font-size:11px}.plist.court5 .pl .sm{display:none}.plist.court5 .pl .fo{text-align:center;font-size:10px}.plist.court5 .pl .fo b{display:inline;font-size:14px;margin-right:2px}
 .plist.bench{grid-template-columns:repeat(2,minmax(0,1fr))}.tm .s{font-size:42px}.clock .t{font-size:36px}.sc-wrap{grid-template-columns:1fr}svg.court{max-height:none}}
@media (max-width:520px){.board{grid-template-columns:1fr 1fr;grid-template-areas:"a b" "c c"}.board .tm:first-child{grid-area:a}.board .tm.r{grid-area:b}.board .clock{grid-area:c;flex-direction:row;justify-content:center;flex-wrap:wrap}
 .act{font-size:15px;padding:12px 2px}.act small{font-size:9.5px;letter-spacing:0}.top h1 small{letter-spacing:1px}.top .btn{padding:7px 10px;font-size:13px}.pbp li{grid-template-columns:52px 46px 1fr 56px;font-size:13px}.shotpop{width:240px}}

    if(S.start[id])delete S.start[id];else{if(Object.keys(S.start).filter(k=>S.start[k]&&S.picked[k]).length>=5){$("#s-err").textContent="Já tens 5 no cinco inicial.";return}S.start[id]=true}renderSetup()});

  $("#s-go").onclick=()=>{const roster=players.filter(p=>S.picked[p.id]).map(p=>({id:p.id,name:p.name,num:(S.nums[p.id]??p.num??"")+""}));

    const nums=roster.map(p=>p.num).filter(Boolean),dup=nums.filter((n,i)=>nums.indexOf(n)!==i);

    if(!gm&&!S.opp.trim()){err.textContent="Escreve o nome do adversário.";return}
    S.picked={};S.start={};S.dupOk=false;
    newGame({team:S.team,teamName:TN[S.team],gameNum:gm?gm.num:"",comp:gm?gm.comp:"",date:gm?gm.date:new Date().toISOString().slice(0,10),venue:gm?gm.venue:"",home:gm?gm.home.startsWith("FC Gaia"):true,opp,np:S.np,per:S.per,roster,oncourt:st.map(p=>p.id)})}}

/* ---------- época / acumulado ---------- */
const SUMK=["pts","m2","a2","m3","a3","mf","af","or","dr","ast","stl","blk","tov","pf","fp","fu","ft","fd","pm","sec"];
function seasonData(){const all=visGames().map(fixGame).filter(g=>!EP.team||g.team===EP.team).sort((a,b)=>(a.date||"").localeCompare(b.date||""));
  const games=all.filter(g=>!EP.excl[g.id]);const A={};
  games.forEach(g=>g.roster.forEach(p=>{const s=g.st[p.id];if(!s)return;const played=s.sec>0||SUMK.some(k=>k!=="sec"&&k!=="pm"&&s[k]);if(!played)return;
    const a=A[p.id]=A[p.id]||{id:p.id,name:p.name,num:p.num,gp:0,teams:new Set(),...Object.fromEntries(SUMK.map(k=>[k,0])),games:[]};
    a.gp++;a.num=p.num||a.num;a.teams.add(TN[g.team]||g.teamName);SUMK.forEach(k=>a[k]+=s[k]||0);a.games.push({g,s})}));
  return {all,games,ath:Object.values(A)}}
function seasonView(){const teams=[...new Set(visGames().map(g=>g.team))];
  if(!teams.length)return `<h2>Época · acumulado</h2><p class="hint">Ainda não há jogos guardados neste dispositivo. Faz jogos ou importa cópias de segurança dos treinadores em “Jogos guardados”.</p>`;
  const {all,games,ath}=seasonData();const avg=EP.mode==="avg";
  const v=(a,k)=>avg?(a[k]/a.gp):a[k];const f1=x=>avg?(Math.round(x*10)/10).toFixed(1):x;
  const cols=[["num","Nº"],["name","Atleta"],["gp","J"],["sec","MIN"],["pts","PTS"],["s2","2PT"],["s3","3PT"],["sf","LL"],["or","RO"],["dr","RD"],["rt","RT"],["ast","AST"],["stl","ROU"],["blk","DL"],["tov","PER"],["pf","F"],["fd","FR"],["pm","+/-"],["val","VAL"]];
  const key=(a,k)=>k==="rt"?a.or+a.dr:k==="val"?eff(a):k==="s2"?a.m2:k==="s3"?a.m3:k==="sf"?a.mf:k==="name"?a.name:k==="num"?(+a.num||999):(a[k]||0);
  const so=EP.sort,desc=!["name","num"].includes(so);
  ath.sort((x,y)=>{let A=key(x,so),B=key(y,so);if(avg&&!["name","num","gp"].includes(so)&&typeof A==="number"){A/=x.gp;B/=y.gp}return desc?(B>A?1:B<A?-1:0):(A>B?1:A<B?-1:0)});
  const w=games.filter(g=>g.us>g.them).length,l=games.filter(g=>g.us<g.them).length;
  const pf=games.reduce((t,g)=>t+g.us,0),pa=games.reduce((t,g)=>t+g.them,0);
  const sh=(m,a)=>`${f1(avg?m/aG():m)}/${f1(avg?a/aG():a)} <small>${pct(m,a)}</small>`;let cur=null;const aG=()=>cur.gp;
  const rows=ath.map(a=>{cur=a;return `<tr data-ath="${esc(a.id)}"><td class="l">${esc(a.num)}</td><td class="l"><b>${esc(a.name)}</b>${a.teams.size>1?` <small>${esc([...a.teams].join(", "))}</small>`:""}</td><td>${a.gp}</td><td>${avg?fmtMin(a.sec/a.gp):fmtMin(a.sec)}</td><td><b>${f1(v(a,"pts"))}</b></td><td>${sh(a.m2,a.a2)}</td><td>${sh(a.m3,a.a3)}</td><td>${sh(a.mf,a.af)}</td><td>${f1(v(a,"or"))}</td><td>${f1(v(a,"dr"))}</td><td>${f1((a.or+a.dr)/(avg?a.gp:1))}</td><td>${f1(v(a,"ast"))}</td><td>${f1(v(a,"stl"))}</td><td>${f1(v(a,"blk"))}</td><td>${f1(v(a,"tov"))}</td><td>${f1(v(a,"pf"))}</td><td>${f1(v(a,"fd"))}</td><td>${(a.pm>0?"+":"")+f1(v(a,"pm"))}</td><td>${f1(eff(a)/(avg?a.gp:1))}</td></tr>`}).join("");
  return `<h2>Época · acumulado</h2>
  <div class="card"><div class="row">
   <label class="f grow">Equipa<select id="ep-team"><option value="">Todos os escalões</option>${teams.map(t=>`<option value="${esc(t)}"${EP.team===t?" selected":""}>${esc(TN[t]||t)}</option>`).join("")}</select></label>
   <div class="seg2 big" role="group" aria-label="Mostrar"><button data-epm="tot" aria-pressed="${!avg}">Totais</button><button data-epm="avg" aria-pressed="${avg}">Médias por jogo</button></div>
   <button class="btn gold" id="ep-xls"${games.length?"":" disabled"}>Exportar Excel</button></div>
   <div class="eps"><span><b>${games.length}</b> jogos</span><span><b>${w}V</b> · <b>${l}D</b></span><span>Marcados <b>${pf}</b> (${games.length?(pf/games.length).toFixed(1):0}/jogo)</span><span>Sofridos <b>${pa}</b> (${games.length?(pa/games.length).toFixed(1):0}/jogo)</span></div></div>

  <h3>Atletas · ${avg?"médias por jogo":"totais"} <small class="hint">(toca no cabeçalho para ordenar · toca num atleta para ver jogo a jogo)</small></h3>
  <div class="tblw"><table class="bs ep"><thead><tr>${cols.map(([k,l])=>`<th class="${k==="name"||k==="num"?"l":""}${EP.sort===k?" srt":""}" data-eps="${k}">${l}</th>`).join("")}</tr></thead><tbody>${rows||'<tr><td class="l" colspan="19">Sem dados nos jogos escolhidos.</td></tr>'}</tbody></table></div>
  <p class="hint">J jogos em que participou · MIN minutos · PTS pontos · 2PT/3PT/LL convertidos/tentados e % · RO/RD/RT ressaltos · AST assistências · ROU roubos · DL desarmes · PER perdas · F faltas cometidas · FR faltas recebidas · VAL valorização.</p>
  ${EP.ath?athSeason(ath.find(a=>a.id===EP.ath)):""}`}
function athSeason(a){if(!a)return "";const shots=a.games.flatMap(({g})=>g.log.filter(e=>e.x!=null&&e.side!=="o"&&e.id===a.id));
  const n=a.gp,av=x=>(Math.round(x/n*10)/10).toFixed(1);
  return `<div class="card athp" id="athp"><div class="athh"><h2>#${esc(a.num)} ${esc(a.name)}</h2><button class="btn sm" id="ath-x">Fechar</button></div>

    const opp=SIDE==="them";const sp=SEL?pById(SEL):null;const dis=!opp&&(!SEL||!G.oncourt.includes(SEL));const D=dis?" disabled":"";
    const shots=G.log.filter(e=>e.x!=null&&e.q===G.q&&(opp?e.side==="o":e.side!=="o"));
    body=`<div class="live">
     <div class="lcol"><div class="secth"><h3>Em campo</h3><button class="btn sm${SUB?" gold":""}" id="b-sub">${SUB?(SUB==="?"?"Quem sai?":"Quem entra?"):"Substituir"}</button></div><div class="plist court5">${on.map(p=>plb(p,false)).join("")}<button class="btn sm${SUB?" gold":""} subm" data-subbtn>${SUB?(SUB==="?"?"Quem sai?":"Quem entra?"):"Substituir"}</button></div>

      <div class="cwrap${opp?" o":""}">${courtSVG(shots,true)}<div class="shotpop" id="shotpop" hidden></div>${dis?`<div class="cmask">Escolhe um atleta para marcar lançamentos</div>`:""}</div>
      <p class="chint">Toca no campo onde foi o lançamento ${opp?"do adversário":""} · ● convertido · ✕ falhado (${qLabel(G.q)})</p></div>
     <div class="acol"><div class="acts">
       <button class="act mk" data-a="1+"${D}>L. livre<small>Convertido</small></button><button class="act ms" data-a="1-"${D}>L. livre<small>Falhado</small></button>

       <button class="act" data-a="ast"${D}>Assist.</button><button class="act" data-a="tov"${D}>Perda</button>
       <button class="act" data-a="stl"${D}>Roubo</button><button class="act" data-a="blk"${D}>Desarme</button>
       <p class="agrp">Faltas cometidas</p>
       <button class="act fl wide" data-a="fp"${D}>Falta pessoal</button>
       <button class="act fx" data-a="fu"${D}>Antidesp.<small>Falta</small></button><button class="act fx" data-a="ft"${D}>Técnica<small>Falta</small></button>
       <p class="agrp">Falta sofrida</p>
       <button class="act fr wide" data-a="fd"${D}>✋ Falta recebida</button></div>
      <div class="bar"><button class="btn" id="b-undo"${G.undo.length?"":" disabled"}>↶ Anular</button><button class="btn" id="b-xls">Excel</button></div>
      <ul class="pbp mini">${G.log.slice(-5).reverse().map(pbpLi).join("")||'<li><span></span><span></span><span class="q">Sem jogadas ainda.</span><span></span></li>'}</ul></div></div>`}
  else if(VIEW==="pbp"){body=`<ul class="pbp">${G.log.slice().reverse().map(pbpLi).join("")}</ul><div class="bar"><button class="btn gold" id="b-xls">Exportar Excel</button></div>`}
  else{const t=totals();
    body=`${fin?`<p class="hint">Jogo terminado e guardado neste dispositivo. Podes exportar o Excel agora ou mais tarde em “Jogos guardados”.</p>`:""}<div class="tblw"><table class="bs"><thead><tr><th class="l">Nº</th><th class="l">Atleta</th><th>MIN</th><th>PTS</th><th>2PT</th><th>3PT</th><th>LL</th><th>RO</th><th>RD</th><th>RT</th><th>AST</th><th>ROU</th><th>DL</th><th>PER</th><th>FP</th><th>FA</th><th>FT</th><th>F</th><th>FR</th><th>+/-</th><th>VAL</th></tr></thead><tbody>
     ${bsRows().map(({p,s})=>`<tr class="${G.oncourt.includes(p.id)&&!fin?"oncourt":""}"><td class="l">${esc(p.num)}</td><td class="l">${esc(p.name)}</td><td>${fmtMin(s.sec)}</td><td><b>${s.pts}</b></td><td>${s.m2}/${s.a2}</td><td>${s.m3}/${s.a3}</td><td>${s.mf}/${s.af}</td><td>${s.or}</td><td>${s.dr}</td><td>${s.or+s.dr}</td><td>${s.ast}</td><td>${s.stl}</td><td>${s.blk}</td><td>${s.tov}</td><td>${s.fp}</td><td>${s.fu}</td><td>${s.ft}</td><td><b>${s.pf}</b></td><td>${s.fd}</td><td>${s.pm>0?"+":""}${s.pm}</td><td>${eff(s)}</td></tr>`).join("")}
     <tr class="tot"><td></td><td class="l">Total</td><td></td><td>${t.pts}</td><td>${t.m2}/${t.a2} <small>${pct(t.m2,t.a2)}</small></td><td>${t.m3}/${t.a3} <small>${pct(t.m3,t.a3)}</small></td><td>${t.mf}/${t.af} <small>${pct(t.mf,t.af)}</small></td><td>${t.or}</td><td>${t.dr}</td><td>${t.or+t.dr}</td><td>${t.ast}</td><td>${t.stl}</td><td>${t.blk}</td><td>${t.tov}</td><td>${t.fp}</td><td>${t.fu}</td><td>${t.ft}</td><td>${t.pf}</td><td>${t.fd}</td><td></td><td>${eff(t)}</td></tr>
     ${(o=>`<tr class="oppr"><td></td><td class="l">${esc(G.opp)} <small>(equipa)</small></td><td></td><td>${o.pts}</td><td>${o.m2}/${o.a2} <small>${pct(o.m2,o.a2)}</small></td><td>${o.m3}/${o.a3} <small>${pct(o.m3,o.a3)}</small></td><td>${o.mf}/${o.af} <small>${pct(o.mf,o.af)}</small></td><td>${o.or}</td><td>${o.dr}</td><td>${o.or+o.dr}</td><td>${o.ast}</td><td>${o.stl}</td><td>${o.blk}</td><td>${o.tov}</td><td>${o.fp}</td><td>${o.fu}</td><td>${o.ft}</td><td>${o.pf}</td><td>${o.fd}</td><td></td><td>${eff(o)}</td></tr>`)(G.ost)}</tbody></table></div>
     <p class="hint">MIN minutos · 2PT/3PT/LL convertidos/tentados · RO/RD/RT ressaltos ofensivos/defensivos/total · AST assistências · ROU roubos · DL desarmes · PER perdas · FP faltas pessoais · FA antidesportivas · FT técnicas · F total de faltas · FR faltas recebidas · VAL valorização.</p>
     ${shotChart()}
     <div class="bar"><button class="btn gold" id="b-xls">Exportar Excel</button>${fin?`<button class="btn" id="b-reopen">Reabrir jogo</button><button class="btn" id="b-list">Voltar aos jogos</button>`:""}</div>`}
  $("#app").innerHTML=board+tabs+body;bind()}
function shotChart(){const all=G.log.filter(e=>e.x!=null&&e.side!=="o"),oppS=G.log.filter(e=>e.x!=null&&e.side==="o"),sh=SHOTF==="_o"?oppS:SHOTF?all.filter(e=>e.id===SHOTF):all;
  const opts=G.roster.filter(p=>all.some(e=>e.id===p.id)).map(p=>`<option value="${esc(p.id)}"${SHOTF===p.id?" selected":""}>#${esc(p.num)} ${esc(p.name)}</option>`).join("");
  return `<h3>Mapa de lançamentos por zona</h3>`+zoneBlock(sh,SHOTF==="_o",`<label class="f">Mostrar<select id="shotf"><option value="">FC Gaia (equipa)</option>${opts}<option value="_o"${SHOTF==="_o"?" selected":""}>Adversário: ${esc(G.opp)}</option></select></label>`)}
function courtPoint(ev){const sv=$("#court");const pt=sv.createSVGPoint();const t=ev.touches?ev.touches[0]:ev;pt.x=t.clientX;pt.y=t.clientY;const q=pt.matrixTransform(sv.getScreenCTM().inverse());return {x:Math.max(0,Math.min(1500,q.x)),y:Math.max(0,Math.min(1400,q.y))}}
function openShot(x,y){if(SIDE!=="them"&&(!SEL||!G.oncourt.includes(SEL))){toast("Escolhe primeiro um atleta em campo");return}
  PEND={x:Math.round(x),y:Math.round(y),v:shotVal(x,y)};
  $("#tmpmk").innerHTML=`<circle cx="${PEND.x}" cy="${PEND.y}" r="30" class="mk-tmp"/>`;
  const pop=$("#shotpop");const left=Math.min(Math.max(PEND.x/1500*100,22),78),top=PEND.y/1400*100;
  pop.style.left=left+"%";pop.style.top=(top>60?top-4:top+6)+"%";pop.style.transform=top>60?"translate(-50%,-100%)":"translate(-50%,0)";
  const pp=SIDE==="them"?{num:"ADV"}:pById(SEL);
  pop.innerHTML=`<p>${SIDE==="them"?esc(G.opp):"#"+esc(pp.num)} · <b>${PEND.v} pts</b> · ${esc(shotZone(PEND.x,PEND.y))}</p><div class="sp-b"><button class="act mk" id="sp-ok">Convertido</button><button class="act ms" id="sp-ko">Falhado</button></div>
   <div class="sp-l"><button class="btn sm" id="sp-tg">Mudar para ${PEND.v===3?2:3} pts</button><button class="btn sm ghost" id="sp-x">Cancelar</button></div>`;
  pop.hidden=false;
  $("#sp-ok").onclick=()=>{const P=PEND;PEND=null;act(P.v+"+",{x:P.x,y:P.y})};
  $("#sp-ko").onclick=()=>{const P=PEND;PEND=null;act(P.v+"-",{x:P.x,y:P.y})};
  $("#sp-tg").onclick=()=>{PEND.v=PEND.v===3?2:3;openShot(PEND.x,PEND.y)};
  $("#sp-x").onclick=()=>{PEND=null;pop.hidden=true;$("#tmpmk").innerHTML=""}}
function pbpLi(e){const sc=["fimq","iniq","fim"].includes(e.t)?"":`${e.us}-${e.them}`;
  return `<li class="${e.side==="o"||(e.t[0]==="o"&&e.t!=="or")?"opp":""}"><span class="q">${e.q>G.np?"P"+(e.q-G.np):e.q+"P"}</span><span class="q">${fmtT(e.c)}</span><span>${esc(logText(e))}</span><span class="sc">${sc}</span></li>`}
function bind(){
  const cv=$("#court");if(cv)cv.addEventListener("click",ev=>{if(ev.target.closest&&ev.target.closest("#shotpop"))return;const q=courtPoint(ev);openShot(q.x,q.y)});
  const sf=$("#shotf");if(sf)sf.onchange=e=>{SHOTF=e.target.value;render()};
  document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{VIEW=b.dataset.v;render()});
  document.querySelectorAll("[data-side]").forEach(b=>b.onclick=()=>{SIDE=b.dataset.side;render()});
  document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>act(b.dataset.a));
  document.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>oppAct(b.dataset.o));
  document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{const id=b.dataset.p,onC=G.oncourt.includes(id);
    if(SUB){if(onC){SUB=id;toast("Sai #"+pById(id).num+": escolhe no banco quem entra");render();return}
      if(SUB==="?"){toast("Escolhe primeiro quem sai (em campo)");return}
      if(G.st[id].pf>=5){toast("Atleta excluído (5 faltas)");return}doSub(id,SUB);return}
    if(onC){SEL=id;SIDE="us"}else toast("Está no banco — usa Substituição");render()});
  const subClick=()=>{if(SUB){SUB=null}else{SUB=SEL&&G.oncourt.includes(SEL)?SEL:"?";if(SUB!=="?")toast("Sai #"+pById(SUB).num+": escolhe no banco quem entra");else toast("Escolhe quem sai")}render()};
  const bs=$("#b-sub");if(bs)bs.onclick=subClick;document.querySelectorAll("[data-subbtn]").forEach(b=>b.onclick=subClick);
  const cr=$("#c-run");if(cr)cr.onclick=()=>{if(G.clock<=0){toast("Período terminado");return}G.running=!G.running;store();render()};
  const ca=$("#c-adj");if(ca)ca.onclick=()=>{if(G.running){toast("Pára o relógio primeiro");return}const v=prompt("Tempo que falta (mm:ss)",fmtT(G.clock));if(!v)return;const m=v.match(/^(\d{1,2}):(\d{2})$/);if(!m){toast("Formato mm:ss");return}G.clock=Math.min(+m[1]*60+ +m[2],(G.q>G.np?5:G.per)*60);store();render()};
  const cn=$("#c-next");if(cn)cn.onclick=nextQ;
  const bu=$("#b-undo");if(bu)bu.onclick=undo;
  document.querySelectorAll("#b-xls").forEach(b=>b.onclick=exportXLS);
  const ro=$("#b-reopen");if(ro)ro.onclick=()=>{G.status="jogo";store();VIEW="live";render()};
  const bl=$("#b-list");if(bl)bl.onclick=()=>{G=null;stopTick();renderSetup()}}
function confirmBox(msg,ok){const m=document.createElement("div");m.className="modal";m.innerHTML=`<div class="card"><p style="margin:0 0 14px;font-size:17px">${esc(msg)}</p><div class="bar"><button class="btn gold" id="m-ok">Sim</button><button class="btn" id="m-no">Não</button></div></div>`;
  document.body.appendChild(m);m.querySelector("#m-ok").onclick=()=>{m.remove();ok()};m.querySelector("#m-no").onclick=()=>m.remove()}

function exportXLS(){const t=totals(),fn=`fcgaia-${G.team.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-")}-${G.date}-vs-${G.opp.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-")}`.replace(/-+/g,"-");
  const head=["Nº","Atleta","MIN","PTS","2PT C","2PT T","2PT %","3PT C","3PT T","3PT %","LL C","LL T","LL %","RO","RD","RT","AST","ROU","DL","PER","F. pessoais","F. antidesportivas","F. técnicas","Total faltas","F. recebidas","+/-","VAL"];
  const row=(n,nm,s,min)=>[n,nm,min,s.pts,s.m2,s.a2,s.a2?+(s.m2/s.a2).toFixed(3):"",s.m3,s.a3,s.a3?+(s.m3/s.a3).toFixed(3):"",s.mf,s.af,s.af?+(s.mf/s.af).toFixed(3):"",s.or,s.dr,s.or+s.dr,s.ast,s.stl,s.blk,s.tov,s.fp,s.fu,s.ft,s.pf,s.fd,s.pm,eff(s)];
  const bs=[head,...bsRows().map(({p,s})=>row(/^\d+$/.test(p.num)?+p.num:p.num,p.name,s,+(s.sec/60).toFixed(1))),row("","TOTAL",t,""),[],row("",G.opp+" (equipa)",G.ost,"")];
  const pbp=[["Período","Tempo","Equipa","Jogada","Atleta","Nº","FC Gaia","Adversário"],...G.log.map(e=>{const p=e.id&&e.side!=="o"?pById(e.id):null;return [e.q>G.np?"Prol. "+(e.q-G.np):e.q,fmtT(e.c),e.side==="o"||/^o/.test(e.t)&&e.t!=="or"?G.opp:["fimq","iniq","fim"].includes(e.t)?"":"FC Gaia",e.t==="sub"?"Substituição (sai "+(pById(e.out)||{}).name+")":LBL[e.t]||e.t,p?p.name:"",p&&/^\d+$/.test(p.num)?+p.num:"",e.us,e.them]})];
  const info=[["Equipa","FC Gaia · "+G.teamName],["Adversário",G.opp],["Data",G.date],["Competição",G.comp||""],["Jogo n.º",G.gameNum||""],["Pavilhão",G.venue||""],["Local",G.home?"Casa":"Fora"],["Resultado",`FC Gaia ${G.us} – ${G.them} ${G.opp}`],["Períodos",`${G.np} × ${G.per} min`],["Exportado",new Date().toLocaleString("pt-PT")]];
  if(window.XLSX){const wb=XLSX.utils.book_new();
    const ws1=XLSX.utils.aoa_to_sheet(bs);ws1["!cols"]=head.map((h,i)=>({wch:i===1?24:h.length>6?12:7}));XLSX.utils.book_append_sheet(wb,ws1,"Estatísticas");
    const ws2=XLSX.utils.aoa_to_sheet(pbp);ws2["!cols"]=[{wch:8},{wch:7},{wch:20},{wch:34},{wch:24},{wch:5},{wch:8},{wch:10}];XLSX.utils.book_append_sheet(wb,ws2,"Jogadas");
    const shots=[["Período","Tempo","Equipa","Atleta","Nº","Valor","Resultado","Zona","X (m)","Y (m)"],...G.log.filter(e=>e.x!=null).map(e=>{const p=e.side==="o"?{}:pById(e.id)||{};return [e.q>G.np?"Prol. "+(e.q-G.np):e.q,fmtT(e.c),e.side==="o"?G.opp:"FC Gaia",p.name||"",/^\d+$/.test(p.num)?+p.num:"",+e.t[0],e.t.endsWith("+")?"Convertido":"Falhado",shotZone(e.x,e.y),+(e.x/100).toFixed(2),+(e.y/100).toFixed(2)]})];
    const wsS=XLSX.utils.aoa_to_sheet(shots);wsS["!cols"]=[{wch:8},{wch:7},{wch:20},{wch:24},{wch:5},{wch:6},{wch:11},{wch:24},{wch:7},{wch:7}];XLSX.utils.book_append_sheet(wb,wsS,"Lançamentos");
    const ws3=XLSX.utils.aoa_to_sheet(info);ws3["!cols"]=[{wch:14},{wch:40}];XLSX.utils.book_append_sheet(wb,ws3,"Jogo");
    try{XLSX.writeFile(wb,fn+".xlsx");toast("Excel exportado")}catch(e){toast("Não foi possível descarregar aqui")}return}
  const csv=bs.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(";")).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["﻿"+csv],{type:"text/csv"}));a.download=fn+".csv";document.body.appendChild(a);a.click();a.remove();toast("Exportado em CSV (sem ligação para gerar Excel)")}
window.addEventListener("beforeunload",()=>{if(G)store()});
document.addEventListener("visibilitychange",()=>{if(G)store()});
boot();
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
